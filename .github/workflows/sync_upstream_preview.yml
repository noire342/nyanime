name: Sync AniYomi bleeding edge

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      integration_branch:
        description: Branch receiving upstream AniYomi changes
        required: false
        default: dev
        type: string
      force_build:
        description: Build and publish the current fork even when upstream is already synchronized
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-aniyomi-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: aniyomiorg/aniyomi
  UPSTREAM_BRANCH: main
  DEFAULT_INTEGRATION_BRANCH: dev
  SYNC_BRANCH: automation/aniyomi-upstream

jobs:
  sync:
    name: Merge AniYomi bleeding edge
    runs-on: ubuntu-24.04

    steps:
      - name: Clone repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Resolve integration branch
        id: base
        env:
          REQUESTED_BRANCH: ${{ inputs.integration_branch }}
        run: |
          set -euo pipefail
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
          branch="${REQUESTED_BRANCH:-$DEFAULT_INTEGRATION_BRANCH}"
          if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            echo "::error::Integration branch '$branch' does not exist on origin. Create it before running the workflow."
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Using fork branch: $branch"

      - name: Fetch latest upstream main
        id: source
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/$UPSTREAM_REPOSITORY.git"
          git fetch --no-tags upstream \
            "refs/heads/$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH"
          main_sha="$(git rev-parse "refs/remotes/upstream/$UPSTREAM_BRANCH")"
          echo "sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${main_sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "AniYomi $UPSTREAM_BRANCH: $main_sha"

      - name: Merge upstream main into dev
        id: merge
        env:
          BASE_BRANCH: ${{ steps.base.outputs.branch }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH" "origin/$BASE_BRANCH"

          changed=false
          if git merge-base --is-ancestor "refs/remotes/upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Fork already contains the latest upstream $UPSTREAM_BRANCH"
          else
            if ! git merge --no-edit --no-ff "refs/remotes/upstream/$UPSTREAM_BRANCH"; then
              git merge --abort || true
              echo "::error::Merge conflict while applying upstream $UPSTREAM_BRANCH to $BASE_BRANCH"
              exit 1
            fi
            changed=true
            echo "Merge commit: $(git rev-parse HEAD)"
          fi

          build=false
          if [[ "$changed" == "true" || "$FORCE_BUILD" == "true" ]]; then
            build=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          if [[ "$build" == "true" && "$changed" == "false" ]]; then
            echo "Manual force build requested for the already synchronized fork"
          fi

      - name: Configure stable preview signing
        if: steps.merge.outputs.build == 'true'
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            echo "::error::Missing ANDROID_DEBUG_KEYSTORE_BASE64 repository secret; refusing to publish an APK that cannot update the installed fork."
            exit 1
          fi
          encoded_keystore="$(printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]')"
          encoded_keystore="$(printf '%s' "$encoded_keystore" | tr -- '-_' '+/')"
          case $((${#encoded_keystore} % 4)) in
            2) encoded_keystore+='==' ;;
            3) encoded_keystore+='=' ;;
            0) ;;
            *) echo "::error::Invalid keystore encoding length"; exit 1 ;;
          esac
          mkdir -p "$HOME/.android"
          printf '%s' "$encoded_keystore" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Verify Anime4K Lua telemetry
        if: steps.merge.outputs.build == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/anime4k-tests"
          "$RUNNER_TEMP/anime4k-tests/bin/python" -m pip install --disable-pip-version-check lupa==2.8
          "$RUNNER_TEMP/anime4k-tests/bin/python" scripts/tests/test_anime4k_telemetry.py

      - name: Verify merged fork and build preview APK
        if: steps.merge.outputs.build == 'true'
        run: ./gradlew spotlessCheck assemblePreview testDebugUnitTest -Penable-updater --no-daemon

      - name: Upload deterministic test reports
        if: always() && steps.merge.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fork-unit-tests
          path: app/build/test-results/testDebugUnitTest
          if-no-files-found: warn

      - name: Verify JNI symbols in optimized APKs
        if: steps.merge.outputs.build == 'true'
        run: python3 scripts/verify_apk_jni.py app/build/outputs/apk/preview/app-*-preview.apk

      - name: Build independent device JNI probe
        if: steps.merge.outputs.build == 'true'
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          android_jar="$sdk_root/platforms/android-36/android.jar"
          d8="$(find "$sdk_root/build-tools" -type f -name d8 | sort -V | tail -n 1)"
          mkdir -p build/jni-probe/classes build/jni-probe/dex
          javac -source 8 -target 8 -cp "$android_jar" -d build/jni-probe/classes scripts/ZstdApkProbe.java
          "$d8" --lib "$android_jar" --output build/jni-probe/dex build/jni-probe/classes/ZstdApkProbe.class

      - name: Preserve release diagnostics and device probe
        if: always() && steps.merge.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-diagnostics
          path: |
            app/build/outputs/mapping/preview/mapping.txt
            build/jni-probe/dex/classes.dex
          if-no-files-found: error

      - name: Probe live public catalogue
        id: catalogue
        if: steps.merge.outputs.build == 'true'
        continue-on-error: true
        env:
          ANIYOMI_VERIFY_CATALOG: 'true'
        run: ./gradlew :app:testDebugUnitTest --tests '*AnilistLiveCatalogTest' --no-daemon

      - name: Upload live catalogue report
        if: always() && steps.catalogue.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalogue-live-probe
          path: app/build/test-results/testDebugUnitTest/TEST-*AnilistLiveCatalogTest.xml
          if-no-files-found: warn

      - name: Verify live fallback catalogue
        if: steps.merge.outputs.build == 'true'
        env:
          ANIYOMI_VERIFY_FALLBACK: 'true'
        run: ./gradlew :app:testDebugUnitTest --tests '*KitsuLiveCatalogTest' --no-daemon

      - name: Upload fallback catalogue report
        if: always() && steps.merge.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalogue-fallback-live
          path: app/build/test-results/testDebugUnitTest/TEST-*KitsuLiveCatalogTest.xml
          if-no-files-found: warn

      - name: Verify stable preview signature
        if: steps.merge.outputs.build == 'true'
        env:
          EXPECTED_CERT_SHA256: F99AD47F9286CE3D61345F65DD0F888F16AEBF53BFE75EFE5B6AB889041AB259
        run: |
          set -euo pipefail
          actual_cert="$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | awk -F': ' '/SHA256:/{print $2; exit}' \
            | tr -cd '[:xdigit:]' \
            | tr '[:lower:]' '[:upper:]')"
          if [[ "$actual_cert" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::Preview signing certificate mismatch. Expected $EXPECTED_CERT_SHA256, got $actual_cert"
            exit 1
          fi
          echo "Stable preview signing certificate verified: $actual_cert"

      - name: Re-sign and verify preview APKs
        if: steps.merge.outputs.build == 'true'
        env:
          EXPECTED_CERT_SHA256: F99AD47F9286CE3D61345F65DD0F888F16AEBF53BFE75EFE5B6AB889041AB259
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$apksigner" || ! -x "$apksigner" ]]; then
            echo "::error::Could not locate the Android apksigner tool."
            exit 1
          fi

          shopt -s nullglob
          apks=(app/build/outputs/apk/preview/app-*-preview.apk)
          if [[ "${#apks[@]}" -eq 0 ]]; then
            echo "::error::No preview APKs were produced."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$apksigner" sign \
              --ks "$HOME/.android/debug.keystore" \
              --ks-pass pass:android \
              --ks-key-alias androiddebugkey \
              --key-pass pass:android \
              "$apk"
            actual_cert="$("$apksigner" verify --verbose --print-certs "$apk" \
              | sed -n 's/.*certificate SHA-256 digest: //p' \
              | head -n 1 \
              | tr -cd '[:xdigit:]' \
              | tr '[:lower:]' '[:upper:]')"
            if [[ "$actual_cert" != "$EXPECTED_CERT_SHA256" ]]; then
              echo "::error::APK signing certificate mismatch for $apk. Expected $EXPECTED_CERT_SHA256, got $actual_cert"
              exit 1
            fi
            echo "Stable preview APK certificate verified for $(basename "$apk"): $actual_cert"
          done

      - name: Prepare APK artifacts
        if: steps.merge.outputs.build == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/preview/app-*-preview.apk dist/
          sha256sum dist/*.apk > dist/SHA256SUMS

      - name: Upload APK artifacts
        if: steps.merge.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aniyomi-preview-${{ steps.source.outputs.short_sha }}
          path: dist
          if-no-files-found: error
          retention-days: 90

      - name: Publish synchronization branch
        if: steps.merge.outputs.build == 'true'
        run: git push --force-with-lease origin "HEAD:$SYNC_BRANCH"

      - name: Publish GitHub preview release
        id: release
        if: steps.merge.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          fork_commit_count="$(git rev-list --count HEAD)"
          tag="r${fork_commit_count}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          notes="Nyanime preview based on $UPSTREAM_REPOSITORY:$UPSTREAM_BRANCH at $MAIN_SHA (fork commit $fork_commit_count)."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.apk dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Nyanime preview $tag" --notes "$notes"
          else
            gh release create "$tag" dist/*.apk dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --target "$SYNC_BRANCH" \
              --title "Nyanime preview $tag" --prerelease --notes "$notes"
          fi

      - name: Open or update synchronization PR
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ steps.base.outputs.branch }}
          MAIN_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          main_short="${MAIN_SHA:0:12}"
          title="Sync AniYomi $UPSTREAM_BRANCH $main_short"
          body="This PR merges the latest upstream $UPSTREAM_REPOSITORY:$UPSTREAM_BRANCH (${MAIN_SHA}) into the fork integration branch (${BASE_BRANCH}). The preview APK and checks are attached to the workflow run."

          number="$(gh pr list --base "$BASE_BRANCH" --head "$SYNC_BRANCH" \
            --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --title "$title" --body "$body"
            echo "Updated PR #$number"
          else
            gh pr create --base "$BASE_BRANCH" --head "$SYNC_BRANCH" \
              --title "$title" --body "$body"
          fi

      - name: Merge synchronization PR
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ steps.base.outputs.branch }}
        run: |
          set -euo pipefail
          number="$(gh pr list --base "$BASE_BRANCH" --head "$SYNC_BRANCH" \
            --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$number" ]]; then
            echo "::warning::The synchronization PR could not be resolved; leaving it open for manual review."
            exit 0
          fi
          if gh pr merge "$number" --merge --delete-branch; then
            echo "Merged synchronization PR #$number"
          elif gh pr merge "$number" --auto --merge --delete-branch; then
            echo "Automatic merge enabled for PR #$number"
          else
            echo "::warning::The synchronization PR could not be merged automatically; PR #$number remains open."
          fi

      - name: Write summary
        if: always()
        env:
          BASE_BRANCH: ${{ steps.base.outputs.branch }}
          MAIN_SHA: ${{ steps.source.outputs.sha }}
          PREVIEW_RELEASE: ${{ steps.release.outputs.tag }}
        run: |
          {
            echo "### AniYomi bleeding-edge synchronization"
            echo "- Source: \`$UPSTREAM_REPOSITORY:$UPSTREAM_BRANCH\`"
            echo "- Source commit: \`$MAIN_SHA\`"
            echo "- Target branch: \`$BASE_BRANCH\`"
            echo "- Preview release: \`${PREVIEW_RELEASE:-not created}\`"
            echo "- APK artifacts are uploaded to this workflow run."
            echo "- Conflicts or failed checks stop the workflow before the PR is updated."
          } >> "$GITHUB_STEP_SUMMARY"
