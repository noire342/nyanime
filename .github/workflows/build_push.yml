name: Nyanime releases and OTA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: 'Publication channel for this manual run'
        required: false
        type: choice
        options: [preview, recommended]
        default: preview

permissions:
  contents: write

concurrency:
  group: nyanime-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout complete release history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Restore the preview signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            echo '::error::The stable preview signing key is missing.'
            exit 1
          fi
          encoded_keystore="$(printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | tr -- '-_' '+/')"
          case $((${#encoded_keystore} % 4)) in
            2) encoded_keystore+='==' ;;
            3) encoded_keystore+='=' ;;
            0) ;;
            *) echo '::error::Invalid signing key encoding.'; exit 1 ;;
          esac
          mkdir -p "$HOME/.android"
          printf '%s' "$encoded_keystore" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Verify the installed preview signing identity
        env:
          EXPECTED_CERT_SHA256: F99AD47F9286CE3D61345F65DD0F888F16AEBF53BFE75EFE5B6AB889041AB259
        run: |
          set -euo pipefail
          actual="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{print $2; exit}' | tr -cd '[:xdigit:]' | tr '[:lower:]' '[:upper:]')"
          if [[ "$actual" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::Preview certificate mismatch: $actual"
            exit 1
          fi

      - name: Validate the public version
        id: version
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$REQUESTED_CHANNEL" ]]; then args+=(--channel "$REQUESTED_CHANNEL"); fi
          python3 -m unittest scripts.tests.test_release_notes scripts.tests.test_release_version
          python3 scripts/release_version.py --check-published --github-output "$GITHUB_OUTPUT" "${args[@]}"

      - name: Check release notes before building
        run: |
          tag="${{ steps.version.outputs.tag }}"
          python3 scripts/release_notes.py --tag "$tag" --output "$RUNNER_TEMP/nyanime-release-notes.md" \
            --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA"

      - name: Check format, tests and build
        run: bash scripts/ci_gradle.sh spotlessCheck :app:testDebugUnitTest :app:assemblePreview -Penable-updater

      - name: Preserve build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-diagnostics-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            build/reports/problems/
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify packaged native libraries
        run: python3 scripts/verify_apk_jni.py app/build/outputs/apk/preview/app-*-preview.apk

      - name: Verify APK signatures and prepare OTA assets
        env:
          EXPECTED_CERT_SHA256: F99AD47F9286CE3D61345F65DD0F888F16AEBF53BFE75EFE5B6AB889041AB259
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo '::error::Android apksigner is unavailable.'
            exit 1
          fi
          mkdir -p dist/numeric
          for abi in universal arm64-v8a armeabi-v7a x86 x86_64; do
            apk="app/build/outputs/apk/preview/app-${abi}-preview.apk"
            test -f "$apk" || { echo "::error::Missing $apk"; exit 1; }
            "$apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android "$apk"
            actual="$("$apksigner" verify --verbose --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -cd '[:xdigit:]' | tr '[:lower:]' '[:upper:]')"
            if [[ "$actual" != "$EXPECTED_CERT_SHA256" ]]; then
              echo "::error::Wrong signing certificate for $apk: $actual"
              exit 1
            fi
            # These names are intentionally not recognized by pre-numeric clients.
            # Those clients must skip the canonical release and choose its compatible alias.
            cp "$apk" "dist/numeric/Nyanime-${version}-${abi}.apk"
          done
          (cd dist/numeric && sha256sum *.apk > SHA256SUMS)

      - name: Keep APKs available from the workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nyanime-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish numeric release and permanent legacy OTA alias
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          LEGACY_TAG: ${{ steps.version.outputs.legacy_tag }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          python3 scripts/release_notes.py --tag "$TAG" --output "$notes_file" \
            --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA"

          check_tag() {
            existing="$(git ls-remote --tags origin "refs/tags/$1" | awk '{print $1}')"
            if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $1 belongs to another commit. Refusing to replace a published APK."
              exit 1
            fi
          }
          publish() {
            local tag="$1" directory="$2" preview="$3"
            local latest=false
            if [[ "$preview" == 'false' ]]; then
              previous_latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
              if python3 - "$tag" "$previous_latest" <<'PY'
          import sys
          from scripts.release_version import VERSION_PATTERN
          current = VERSION_PATTERN.fullmatch(sys.argv[1].removeprefix('v'))
          previous = VERSION_PATTERN.fullmatch(sys.argv[2].removeprefix('v'))
          raise SystemExit(0 if not previous or tuple(map(int, current.groups())) >= tuple(map(int, previous.groups())) else 1)
          PY
              then latest=true; fi
            fi
            check_tag "$tag"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
              if [[ "$draft" == 'true' ]]; then
                gh release upload "$tag" "$directory"/* --repo "$GITHUB_REPOSITORY" --clobber
              fi
              # Published APKs are immutable; changing channels promotes the same bytes.
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "Nyanime $VERSION" \
                --notes-file "$notes_file" --prerelease="$preview" --draft=false --latest="$latest"
            else
              gh release create "$tag" "$directory"/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "Nyanime $VERSION" --notes-file "$notes_file" --draft
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --prerelease="$preview" --draft=false --latest="$latest"
            fi
          }

          canonical_exists=false
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then canonical_exists=true; fi
          preview=true
          if [[ "$CHANNEL" == 'recommended' ]]; then preview=false; fi
          publish "$TAG" dist/numeric "$preview"

          # Every publication keeps an r-style release with fixed APK names. Old apps
          # can therefore jump directly to the latest version, even years later.
          # Numeric clients ignore these aliases; legacy clients skip numeric filenames.
          if [[ "$canonical_exists" == 'true' ]]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Nyanime-*.apk' \
              --dir dist/numeric --clobber
          fi
          mkdir -p dist/legacy
          for abi in universal arm64-v8a armeabi-v7a x86 x86_64; do
            cp "dist/numeric/Nyanime-${VERSION}-${abi}.apk" "dist/legacy/app-${abi}-preview.apk"
          done
          (cd dist/legacy && sha256sum *.apk > SHA256SUMS)
          publish "$LEGACY_TAG" dist/legacy true
