name: Proponi una funzione
description: Proponi un miglioramento per Nyanime.
labels: [Feature request]
body:
  - type: textarea
    id: need
    attributes:
      label: Quale esigenza vuoi risolvere?
      description: Descrivi una situazione concreta nell'uso dell'app.
    validations:
      required: true
  - type: textarea
    id: feature-description
    attributes:
      label: Comportamento desiderato
      description: Spiega il flusso e i controlli; considera anche le funzioni già presenti.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibilità e casi particolari
      description: Se pertinenti, indica ModernUI/legacy, manga, offline, incognito, player, Cast e stanze.
  - type: textarea
    id: other-details
    attributes:
      label: Alternative o riferimenti
      description: Usa esempi generici, senza nomi o materiali delle integrazioni private.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Controlli
      options:
        - label: Ho consultato le funzionalità documentate e cercato proposte simili.
          required: true
        - label: La proposta e gli allegati non contengono dati personali o materiali delle integrazioni private.
          required: true
