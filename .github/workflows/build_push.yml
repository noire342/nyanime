name: Nyanime preview and OTA release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nyanime-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout complete history for the preview revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Restore the preview signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            echo '::error::The stable preview signing key is missing.'
            exit 1
          fi
          encoded_keystore="$(printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | tr -- '-_' '+/')"
          case $((${#encoded_keystore} % 4)) in
            2) encoded_keystore+='==' ;;
            3) encoded_keystore+='=' ;;
            0) ;;
            *) echo '::error::Invalid signing key encoding.'; exit 1 ;;
          esac
          mkdir -p "$HOME/.android"
          printf '%s' "$encoded_keystore" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Verify the installed preview signing identity
        env:
          EXPECTED_CERT_SHA256: F99AD47F9286CE3D61345F65DD0F888F16AEBF53BFE75EFE5B6AB889041AB259
        run: |
          set -euo pipefail
          actual="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{print $2; exit}' | tr -cd '[:xdigit:]' | tr '[:lower:]' '[:upper:]')"
          if [[ "$actual" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::Preview certificate mismatch: $actual"
            exit 1
          fi

      - name: Check format, tests and build
        run: ./gradlew spotlessCheck :app:testDebugUnitTest :app:assemblePreview -Penable-updater --no-daemon --no-parallel --max-workers=2

      - name: Check release notes selection
        run: python3 -m unittest discover -s scripts/tests -p test_release_notes.py

      - name: Verify packaged native libraries
        run: python3 scripts/verify_apk_jni.py app/build/outputs/apk/preview/app-*-preview.apk

      - name: Verify APK signatures and prepare OTA assets
        env:
          EXPECTED_CERT_SHA256: F99AD47F9286CE3D61345F65DD0F888F16AEBF53BFE75EFE5B6AB889041AB259
        run: |
          set -euo pipefail
          tag="r$(git rev-list --count HEAD)"
          echo "NYANIME_TAG=$tag" >> "$GITHUB_ENV"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo '::error::Android apksigner is unavailable.'
            exit 1
          fi
          mkdir -p dist
          for abi in universal arm64-v8a armeabi-v7a x86 x86_64; do
            apk="app/build/outputs/apk/preview/app-${abi}-preview.apk"
            test -f "$apk" || { echo "::error::Missing $apk"; exit 1; }
            "$apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android "$apk"
            actual="$("$apksigner" verify --verbose --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -cd '[:xdigit:]' | tr '[:lower:]' '[:upper:]')"
            if [[ "$actual" != "$EXPECTED_CERT_SHA256" ]]; then
              echo "::error::Wrong signing certificate for $apk: $actual"
              exit 1
            fi
            # Older Nyanime previews recognize these stable names; the release tag
            # carries the version and lets every installed preview upgrade directly.
            cp "$apk" "dist/app-${abi}-preview.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS)

      - name: Keep APKs available from the workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nyanime-preview-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release for OTA
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$NYANIME_TAG"
          existing="$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')"
          if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $tag already points to another commit. Refusing to replace an OTA version."
            exit 1
          fi
          notes_file="$(mktemp)"
          python3 scripts/release_notes.py --tag "$tag" --output "$notes_file" \
            --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "Nyanime $tag" --notes-file "$notes_file" --prerelease --draft=false
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Nyanime $tag" --notes-file "$notes_file" --prerelease
          fi
