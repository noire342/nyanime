name: App performance and interface checks

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - .github/workflows/app_performance.yml
      - macrobenchmark/**
      - app/src/benchmark/**

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        mode: [journeys, profile]
    env:
      PROFILE_ARGUMENT: ${{ matrix.mode == 'profile' && '-PprofileGeneration=true' || '' }}
      TEST_ARGUMENT: ${{ matrix.mode == 'profile' && '-Pandroid.testInstrumentationRunnerArguments.class=tachiyomi.macrobenchmark.BaselineProfileGenerator' || '-Pandroid.testInstrumentationRunnerArguments.notClass=tachiyomi.macrobenchmark.BaselineProfileGenerator' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          java-version: 17
          distribution: temurin
      - uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b
        with:
          cache-read-only: false
      - name: Build isolated benchmark applications
        run: ./gradlew :app:assembleBenchmark :macrobenchmark:assembleBenchmark $PROFILE_ARGUMENT --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Measure synthetic journeys and generate profile
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :macrobenchmark:connectedBenchmarkAndroidTest -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR $PROFILE_ARGUMENT $TEST_ARGUMENT --no-daemon
      - name: Preserve benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-performance-${{ matrix.mode }}-${{ github.sha }}
          path: |
            macrobenchmark/build/outputs/connected_android_test_additional_output/
            macrobenchmark/build/outputs/androidTest-results/
            macrobenchmark/build/reports/androidTests/
          retention-days: 14
