name: Segnala un problema
description: Descrivi un problema riproducibile in Nyanime.
labels: [Bug]
body:
  - type: markdown
    attributes:
      value: |
        Questa segnalazione riguarda Nyanime. Consulta prima le FAQ e CONTRIBUTING.md nel repository.
        Non allegare codici di stanze, cookie, token, URL firmati, dati personali o materiali delle integrazioni private.
  - type: textarea
    id: reproduce-steps
    attributes:
      label: Passaggi per riprodurre
      description: Usa nomi e contenuti sintetici; indica anche la frequenza del problema.
      placeholder: |
        1. Apri...
        2. Tocca...
        3. Succede...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Comportamento atteso
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Comportamento effettivo
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Versione completa di Nyanime
      description: Copia la versione da Altro > Informazioni e indica l'eventuale revisione rNNNN.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Modello del dispositivo e versione Android
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interfaccia
      options:
        - ModernUI
        - Legacy
        - Entrambe
        - Non pertinente
    validations:
      required: true
  - type: dropdown
    id: playback-context
    attributes:
      label: Contesto di riproduzione
      options:
        - Visione individuale
        - Stanza come host
        - Stanza come ospite
        - Google Cast
        - UPnP/DLNA
        - Player esterno
        - Non pertinente
    validations:
      required: true
  - type: textarea
    id: playback-details
    attributes:
      label: Dettagli del player, se pertinente
      description: Indica modalità Anime4K, qualità, avvio/ripresa/seek/uscita, presenza di buffering e differenze fra versioni.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostica aggiuntiva
      description: Solo estratti necessari e immagini sintetiche senza dati privati.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Controlli
      options:
        - label: Ho cercato una segnalazione già esistente e indicato passaggi e versione.
          required: true
        - label: Ho rimosso dati personali e materiali delle integrazioni private da testo e allegati.
          required: true
